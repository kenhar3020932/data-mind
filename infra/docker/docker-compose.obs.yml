version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: datamind-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yaml:/etc/prometheus/alerts.yaml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: datamind-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./grafana/dashboards.json:/etc/grafana/provisioning/dashboards/default.json
    depends_on:
      - prometheus
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: datamind-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: datamind-promtail
    volumes:
      - /var/log:/var/log
      - /home/kk/Desktop/NEW\ PROJECT/backend:/app/logs
    command:
      - '--config.file=/etc/promtail/config.yml'
    networks:
      - internal
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: datamind-tempo
    ports:
      - "3200:3200"
      - "9095:9095"
      - "4317:4317"
    volumes:
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo/config.yml
    networks:
      - internal
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  internal:
    driver: bridge
