version: "3.9"

services:
  superset:
    image: apache/superset:latest
    container_name: datamind-superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-ChangeMeSecretKey}
      - DATABASE_URL=postgresql+psycopg2://superset:superset@postgres:5432/superset
      - REDIS_HOST=redis
      - SUPERSET_LOAD_EXAMPLES=no
    volumes:
      - superset_home:/app/superset
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: datamind-metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=metabase
      - MB_DB_PASS=${METABASE_DB_PASSWORD:-metabase}
      - MB_DB_HOST=postgres
      - MB_EMAIL_SITE_URL=http://localhost:3000
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  superset_home:
  metabase_data:

networks:
  internal:
    driver: bridge
