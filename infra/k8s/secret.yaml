apiVersion: v1
kind: Secret
metadata:
  name: datamind-secrets
  namespace: datamind
type: Opaque
stringData:
  # Database
  database-url: "postgresql+asyncpg://datamind:${POSTGRES_PASSWORD}@datamind-postgres:5432/datamind"
  postgres-password: ""

  # Redis
  redis-url: "redis://datamind-redis:6379/0"

  # JWT
  secret-key: ""
  jwt-algorithm: "HS256"

  # MinIO
  minio-endpoint: "datamind-minio:9000"
  minio-access-key: ""
  minio-secret-key: ""

  # LLM
  anthropic-api-key: ""
  anthropic-base-url: "https://api.anthropic.com"

  # OAuth (Google)
  google-client-id: ""
  google-client-secret: ""

  # Email
  smtp-host: "smtp.example.com"
  smtp-port: "587"
  smtp-user: ""
  smtp-password: ""
