global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'datamind-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['datamind-backend:8000']
    metric_relabelings:
      - source_labels: [__name__]
        regex: 'go_.*'
        action: drop

  - job_name: 'datamind-postgres'
    static_configs:
      - targets: ['datamind-postgres-exporter:9187']

  - job_name: 'datamind-redis'
    static_configs:
      - targets: ['datamind-redis-exporter:9121']

  - job_name: 'datamind-minio'
    static_configs:
      - targets: ['datamind-minio:9000']
    metrics_path: /minio/v2/metrics/cluster

  - job_name: 'datamind-grafana'
    static_configs:
      - targets: ['datamind-grafana:3000']

remote_write:
  - url: http://prometheus-backup:9090/api/v1/write
    remote_timeout: 30s
    write_relabel_configs:
      - source_labels: [cluster]
        regex: '.*'
        target_label: cluster
        replacement: 'datamind-prod'
