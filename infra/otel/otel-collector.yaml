apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: datamind
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317

      prometheus:
        config:
          scrape_configs:
            - job_name: 'datamind-backend'
              static_configs:
                - targets: ['datamind-backend:8000']

            - job_name: 'datamind-postgres'
              static_configs:
                - targets: ['datamind-postgres-exporter:9187']

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024

      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25

      attributes:
        actions:
          - key: environment
            value: production
            action: upsert
          - key: service.namespace
            value: datamind
            action: upsert

    exporters:
      otlp:
        endpoint: tempo:4317
        tls:
          insecure: true

      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true

      logging:
        loglevel: debug

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]

        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus, logging]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [logging]
